name: Engine regressions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native_engine:
    name: Native engine — item and suppression regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the addon and its pinned engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest requests
      - name: Run native engine regressions
        run: python harness/check_engine.py
