# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Lean config: real code review on PRs (advisory, never blocks merges), short PR
# output, and on issues only labels plus one short note (no auto coding plans).
# Keys left out use CodeRabbit's defaults (see the schema). inheritance stays off,
# so organisation settings cannot add noise back.
language: en-AU
tone_instructions: >-
  Be brief and direct. Flag only real problems: correctness, security, user-data
  safety, Anki/PyQt compatibility. No style nits, praise or restating the diff. One
  short paragraph per finding with a concrete fix. Keep chat replies short.
early_access: true
inheritance: false

reviews:
  profile: chill
  # Advisory only: no "changes requested" / auto-approve reviews. Merges are
  # gated by the required human approvals and CI, not by CodeRabbit.
  auto_approvals:
    enabled: false
  # No skipped / paused / rate-limit status messages in the walkthrough.
  review_status: false

  # Walkthrough: collapsed, short summary; extra walkthrough sections switched off.
  collapse_walkthrough: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: >-
    At most 5 short bullets, no headings and no per-file lists. Lead with the
    user-visible impact. Call out any change to saved user data, setting defaults,
    Anki/PyQt compatibility, release packaging, or bundled Pokémon data.
  auto_title_instructions: >-
    Imperative Conventional Commit title with a concise scope, e.g.
    fix(battle): prevent duplicate experience awards.
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  poem: false
  in_progress_fortune: false
  review_details: false
  review_info: false
  enable_prompt_for_ai_agents: false

  suggested_reviewers: false
  auto_assign_reviewers: false

  # suggested_labels stays at its default (on) because auto_apply_labels
  # applies the suggested ones.
  auto_apply_labels: true
  mutually_exclusive_groups:
    priority:
      - 00 priority
      - 01 priority
      - 02 priority
      - 03 priority
      - 04 priority
  labeling_instructions:
    - label: bug
      instructions: >-
        Fixes incorrect behaviour, a crash, regression, data corruption,
        compatibility failure, or other defect.
    - label: enhancement
      instructions: >-
        Adds a user-visible capability or materially improves a feature,
        performance, accessibility, or user experience.
    - label: documentation
      instructions: >-
        Documentation, examples, help text, translations, or comments are a
        primary part of the change. May coexist with another type label.
    - label: refactoring
      instructions: >-
        Main purpose is internal restructuring or maintainability with no
        intended user-visible behaviour change.
    - label: release
      instructions: >-
        Version bumps, release notes, packaging, tagging, or release-workflow
        changes intended to publish an Ankimon build.
    - label: automated
      instructions: >-
        Generated by a bot or automated maintenance process (dependencies,
        generated data, formatting, release automation).
    - label: major
      instructions: >-
        Only for a breaking change, significant migration, major feature, or
        release-level change needing prominent communication.
    - label: 00 priority
      instructions: >-
        Emergency only: an actively exploitable vulnerability, likely
        irreversible user-data loss/corruption, a broken release, or a widespread
        failure that makes Ankimon unusable. Not when a lower priority can
        reasonably apply.
    - label: 01 priority
      instructions: >-
        Urgent, high-impact work that is not a 00 emergency, such as a release
        blocker, common crash, serious regression in core review or battle
        flows, supported Anki/PyQt incompatibility, or important security/privacy
        weakness.
    - label: 02 priority
      instructions: >-
        Apply exactly this priority only when evidence establishes significant
        impact that should be addressed soon and neither 00 nor 01 applies:
        meaningful saved-progress or inventory loss, substantive security/privacy
        exposure, significant interruption of a supported core workflow, or a
        specifically identified near-term release/dependency blocker. Explain the
        affected flow, concrete consequence, supporting evidence (such as a
        reproduction, test, log, or traced code path), and available workaround
        (or explicitly state that none is known). A confirmed bug, feature request,
        individual Pokémon/move/item fix, large diff, implementation complexity,
        or speculative risk alone is insufficient. When uncertain between 02 and
        03, choose 03 unless evidence meets this threshold. Always use 00 or 01
        when their criteria apply.
    - label: 03 priority
      instructions: >-
        Default for ordinary actionable work: routine fixes, features, refactors,
        tests, and documentation, including contained Pokémon/move/item defects.
        Use 04, 01 or 00 when their criteria apply, and 02 only with its required
        evidence (if unsure between 02 and 03, use 03). Correctness, security,
        or test defects introduced by the PR remain merge blockers but do not by
        themselves raise the PR's priority; classify the underlying work by its
        demonstrated impact.
    - label: 04 priority
      instructions: >-
        Low-impact, non-urgent polish, optional cleanup, cosmetic tweaks, or rare
        edge cases that can safely wait.

  # Drafts are reviewed too (most work here starts as a draft). Automatic
  # re-reviews pause after the default 5 commits; "@coderabbitai review" resumes.
  auto_review:
    enabled: true
    drafts: true
    ignore_title_keywords:
      - "DO NOT REVIEW"
    base_branches:
      - ".*"

  # Generators off (unit tests, Fix comments, Fix CI, merge-conflict resolver;
  # custom recipes removed), which also drops their checkboxes from PRs.
  finishing_touches:
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  # Advisory: two warning-only checks; the rest are off. A warning never blocks.
  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: Security and privacy
        mode: warning
        instructions: >-
          Pass only when changed code introduces no exposed secret, unsafe dynamic
          execution, injection path, untrusted download risk, path traversal, or
          unnecessary collection/disclosure of user data. Documentation-only PRs
          pass unless they expose sensitive information or recommend unsafe steps.
          When the check passes, explain it in one sentence.
      - name: User data safety
        mode: warning
        instructions: >-
          Pass only when changes cannot silently lose or corrupt user collections,
          configuration, saves, backups, inventory, or Pokémon state. Any schema
          change must preserve old data or include a documented, recoverable
          migration. PRs that cannot affect persisted data pass.
          When the check passes, explain it in one sentence.

  # Security/correctness tools (ruff, semgrep, gitleaks, trufflehog, osvScanner,
  # actionlint, zizmor, shellcheck, ast-grep, presidio, ...) keep their defaults
  # (enabled). Prose/style linters and duplicate Python/semgrep linters are off.
  tools:
    flake8:
      enabled: false
    pylint:
      enabled: false
    opengrep:
      enabled: false
    languagetool:
      enabled: false
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    htmlhint:
      enabled: false
    stylelint:
      enabled: false
    dotenvLint:
      enabled: false

  # Ignore non-reviewable or generated bulk while retaining source, metadata,
  # translations, small configuration data, and workflow files for deep review.
  path_filters:
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!**/.pytest_cache/**"
    - "!**/.ruff_cache/**"
    - "!build/**"
    - "!dist/**"
    - "!missing_back_sprites/**"
    - "!src/ankimon_backups/**"
    - "!src/Ankimon/addon_sprites/**"
    - "!src/Ankimon/addon_files/lib/**"
    - "!src/Ankimon/user_files/backups/**"
    - "!src/Ankimon/user_files/data_files/**"
    - "!src/Ankimon/user_files/sprites/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.zip"
    - "!**/*.mp3"
    - "!**/*.wav"
    - "!**/*.ttf"
    - "!**/*.otf"

  path_instructions:
    - path: "**/*.py"
      instructions: |
        Treat this as an Anki add-on running inside a long-lived desktop process.
        Review for Python correctness, clear state ownership, import-time side
        effects, swallowed exceptions, resource leaks, unsafe file/network access,
        cross-platform paths, and code that can freeze or crash Anki. Prefer small,
        testable functions and preserve public behaviour unless change is explicit.
        Flag fabricated APIs or assumptions not supported by this repository.
    - path: "src/Ankimon/{__init__.py,hooks.py,menu_buttons.py,resources.py}"
      instructions: |
        Scrutinise add-on startup/shutdown, hook registration, duplicate handlers,
        profile lifecycle, reload behaviour, dependency availability, and failures
        that could prevent Anki from starting. Cleanup must mirror registration.
    - path: "src/Ankimon/{gui_classes,pyobj,classes}/**/*.py"
      instructions: |
        Review Qt code for parent/object ownership, signal duplication, thread
        affinity, modal-dialog behaviour, deleted widgets, timers, event-loop
        blocking, safe webview content, accessibility, and correct PyQt6 APIs.
        User-facing errors must be actionable without exposing private data.
    - path: "src/Ankimon/{business.py,functions/**/*.py,utils/**/*.py,poke_engine/**/*.py}"
      instructions: |
        Verify battle and collection invariants, probability boundaries, stat and
        experience arithmetic, item consumption, evolution/catch conditions, and
        deterministic behaviour. When changed logic consumes external or bundled
        data, validate it at the ingestion boundary. Add regression tests for fixed
        edge cases. Do not confuse Pokémon move priority data with repository issue
        priority labels.
    - path: "src/Ankimon/{config*.py,config.json,manifest.json,meta.json,pyobj/settings.py}"
      instructions: |
        Check setting names, types, defaults, migrations, and UI exposure together.
        Preserve unknown/legacy user settings, reject invalid values safely, and
        keep add-on/version metadata consistent with packaging and documentation.
    - path: "{ResetFiles,src/Ankimon/user_files,src/Ankimon/addon_files,src/Ankimon/lang}/**/*.json"
      instructions: |
        Validate JSON structure and UTF-8 content. Check identifiers and references,
        duplicate/missing keys, translations, reset/default parity, and backwards
        compatibility. Never replace user-owned progress with bundled defaults as a
        side effect of an ordinary update.
    - path: "**/*.{html,js,css}"
      instructions: |
        Review content used in Anki webviews for injection/XSS, unsafe interpolation,
        remote-resource assumptions, broken escaping, event/listener leaks, asset
        path portability, accessibility, and layout regressions at common sizes.
    - path: ".github/workflows/**/*.{yml,yaml}"
      instructions: |
        Enforce least-privilege permissions, immutable action pinning where feasible,
        safe handling of event data and shell interpolation, current action APIs,
        deterministic artifacts, valid release/tag logic, and no untrusted code with
        write-capable tokens. Identify workflows that are syntactically incomplete.
    - path: ".github/ISSUE_TEMPLATE/**"
      instructions: |
        Ensure templates gather reproducible steps, supported Anki/Ankimon versions,
        OS, logs with secrets removed, expected behaviour, and minimal diagnostic
        data. Never encourage uploading private collections or unnecessary user data.
    - path: "**/*.{md,txt}"
      instructions: |
        Check technical accuracy, current paths/versions, safe commands, link health,
        accessibility, and consistency with actual code and packaging. Preserve
        licence and attribution text unless the change is demonstrably correct.

chat:
  art: false
  allow_non_org_members: false
  auto_reply: false

knowledge_base:
  learnings:
    approval_delay: 3

# Issues: labels plus one short enrichment note (possible duplicates). Automatic
# coding plans are off; a plan is posted only on "@coderabbitai plan".
issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: false
  labeling:
    auto_apply_labels: true
    labeling_instructions:
      - label: bug
        instructions: >-
          Reports reproducible incorrect behaviour, a crash, regression, data
          corruption, compatibility problem, or documented feature behaving
          contrary to expectations.
      - label: enhancement
        instructions: >-
          Requests a new capability or a material improvement to behaviour,
          performance, accessibility, or user experience.
      - label: documentation
        instructions: >-
          The requested outcome mainly changes documentation, setup guidance, help
          text, examples, translations, or explanatory content.
      - label: refactoring
        instructions: >-
          Proposes internal restructuring, cleanup, or technical-debt work with no
          intended user-visible behaviour change.
      - label: question
        instructions: >-
          Mainly asks for support, clarification, expected behaviour, or usage
          guidance and does not yet establish a defect.
      - label: duplicate
        instructions: >-
          Only when an existing issue describes substantially the same problem or
          request; similarity in a few keywords is not enough.
      - label: good first issue
        instructions: >-
          Well-scoped, low-risk, locally understandable work that needs no deep
          knowledge of Anki hooks, persistence, release infrastructure, or coupled
          battle systems.
      - label: help wanted
        instructions: >-
          Explicitly seeks community help, or needs specialised testing/domain
          knowledge that maintainers are unlikely to supply alone.
      - label: 00 priority
        instructions: >-
          Emergency only: actively exploitable security, likely irreversible
          user-data loss/corruption, a broken release, or a widespread failure
          making Ankimon unusable. Never infer 00 from urgency wording alone. Do
          not apply another priority label with it.
      - label: 01 priority
        instructions: >-
          Urgent work that is not a 00 emergency, such as a release blocker,
          common core-flow crash, serious regression, supported Anki/PyQt
          incompatibility, or high-impact security/privacy weakness. Do not apply
          another priority label with it.
      - label: 02 priority
        instructions: >-
          Apply only this priority when evidence establishes significant impact
          that should be addressed soon and neither 00 nor 01 applies: meaningful
          saved-progress or inventory loss, substantive security/privacy exposure,
          significant interruption of a supported core workflow, or a specifically
          identified near-term release/dependency blocker. Explain the affected
          flow, concrete consequence, supporting evidence (such as a reproduction,
          test, log, or traced code path), and available workaround (or explicitly
          state that none is known). A confirmed bug, feature request, individual
          Pokémon/move/item fix, large diff, implementation complexity, or
          speculative risk alone is insufficient. When uncertain between 02 and
          03, choose 03 unless evidence meets this threshold. Always use 00 or 01
          when their criteria apply. Do not apply another priority label with it.
      - label: 03 priority
        instructions: >-
          Default for ordinary actionable work: routine fixes, features, refactors,
          tests, and documentation, including contained Pokémon/move/item defects.
          Use 04, 01 or 00 when their criteria apply, and 02 only with its required
          evidence (if unsure between 02 and 03, use 03). Defects introduced while
          implementing the work remain merge blockers but do not by themselves
          raise the issue's priority; classify it by its demonstrated impact. Do
          not apply another priority label with it.
      - label: 04 priority
        instructions: >-
          Non-urgent polish, optional cleanup, cosmetic tweaks, or rare low-impact
          edge cases that can safely wait. Do not apply another priority label
          with it.
