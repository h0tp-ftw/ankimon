# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Keep this repository fully configured even when organization/global settings are off.
language: en-AU
tone_instructions: >-
  Be direct, precise, constructive, and evidence-based. Prioritise correctness,
  security, data integrity, Anki compatibility, and actionable fixes over style trivia.
early_access: true
enable_free_tier: true
inheritance: false

reviews:
  profile: assertive
  request_changes_workflow: true

  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    Start with the user-visible impact, then summarise implementation changes,
    compatibility or migration concerns, test evidence, and residual risks.
    Explicitly call out changes to saved user data, configuration defaults,
    Anki/PyQt compatibility, release packaging, or bundled Pokémon data.
  auto_title_instructions: >-
    Use an imperative Conventional Commit-style title with a concise scope when
    useful, for example: fix(battle): prevent duplicate experience awards.

  review_status: true
  review_details: true
  review_progress: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  enable_prompt_for_ai_agents: true
  abort_on_close: true

  suggested_labels: true
  auto_apply_labels: true
  mutually_exclusive_groups:
    priority:
      - 00 priority
      - 01 priority
      - 02 priority
      - 03 priority
      - 04 priority
  labeling_instructions:
    - label: bug
      instructions: >-
        Apply when the PR fixes incorrect behaviour, a crash, regression, data
        corruption, compatibility failure, or other defect.
    - label: enhancement
      instructions: >-
        Apply when the PR adds a user-visible capability or materially improves
        an existing feature, performance, accessibility, or user experience.
    - label: documentation
      instructions: >-
        Apply when documentation, examples, help text, translations, or comments
        are a primary part of the change. It may coexist with another type label.
    - label: refactoring
      instructions: >-
        Apply when the primary purpose is internal restructuring or maintainability
        without an intended user-visible behaviour change.
    - label: release
      instructions: >-
        Apply to version bumps, release notes, packaging, tagging, or release
        workflow changes intended to publish an Ankimon build.
    - label: automated
      instructions: >-
        Apply when the PR was generated by a bot or automated maintenance process,
        such as dependency, generated-data, formatting, or release automation.
    - label: major
      instructions: >-
        Apply only when the PR introduces a breaking change, significant migration,
        major feature, or release-level change requiring prominent communication.
    - label: 00 priority
      instructions: >-
        Apply exactly this priority only for an emergency: an actively exploitable
        vulnerability, likely irreversible user-data loss/corruption, a broken
        release, or a widespread failure that makes Ankimon unusable. Do not use
        when a lower priority can reasonably apply.
    - label: 01 priority
      instructions: >-
        Apply exactly this priority for urgent, high-impact work such as a release
        blocker, common crash, serious regression in core review or battle flows,
        supported Anki/PyQt incompatibility, or important security/privacy weakness
        that is not a 00 emergency.
    - label: 02 priority
      instructions: >-
        Apply exactly this priority for important work that should be scheduled
        soon: confirmed non-critical bugs, meaningful feature work, notable
        performance/accessibility improvements, or moderate maintenance risk.
    - label: 03 priority
      instructions: >-
        Apply exactly this priority to normal backlog work with ordinary impact,
        including routine enhancements, refactors, tests, documentation, and
        contained defects when no stronger or weaker priority fits.
    - label: 04 priority
      instructions: >-
        Apply exactly this priority only to low-impact, non-urgent polish, optional
        cleanup, cosmetic tweaks, or rare edge cases that can safely wait.

  suggested_reviewers: true
  auto_assign_reviewers: true

  slop_detection:
    enabled: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    ignore_title_keywords:
      - "DO NOT REVIEW"
    labels: []
    drafts: true
    base_branches:
      - ".*"
    ignore_usernames: []

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
    custom:
      - name: audit Anki runtime compatibility
        enabled: true
        instructions: |
          Audit the changed code for supported Anki and PyQt6 compatibility.
          Check hook registration, imports, Qt API usage, object lifetime, signal
          connections, thread affinity, webview interactions, and add-on startup
          side effects. Make only focused fixes supported by repository evidence.
      - name: audit user data safety
        enabled: true
        instructions: |
          Trace every changed read, write, migration, backup, and reset path for
          user-owned JSON data. Prevent silent data loss, partial writes, schema
          drift, unsafe defaults, path traversal, and corruption after interruption.
          Preserve backward compatibility unless the PR explicitly documents a
          migration and recovery path.
      - name: audit game logic invariants
        enabled: true
        instructions: |
          Review changed encounter, battle, move, experience, evolution, inventory,
          and catch logic for invariant violations, off-by-one errors, invalid state,
          nondeterministic tests, and divergence from the bundled data model. Apply
          focused corrections and add regression tests where practical.
      - name: prepare release readiness fixes
        enabled: true
        instructions: |
          Check version metadata, release notes, addon packaging, workflow safety,
          artifact contents, and compatibility statements for consistency. Fix
          deterministic release blockers without changing the intended version.
      - name: harden external input handling
        enabled: true
        instructions: |
          Audit changed network responses, URLs, downloaded assets, issue-provided
          files, translations, HTML, and JSON before they reach storage, game logic,
          or a webview. Add validation, safe failure behaviour, and clear logging.

  pre_merge_checks:
    # Preserve a human escape hatch: only requested reviewers, never the PR
    # author alone, may override a judgement-based pre-merge finding.
    override_requested_reviewers_only: true
    docstrings:
      mode: warning
      threshold: 80
    title:
      mode: error
      requirements: >-
        Use a concise imperative title, preferably type(scope): summary, that
        describes the actual change and does not end with a period.
    description:
      mode: error
    issue_assessment:
      mode: warning
    custom_checks:
      - name: Security and privacy
        mode: error
        instructions: >-
          Pass only when changed code introduces no exposed secret, unsafe dynamic
          execution, injection path, untrusted download risk, path traversal, or
          unnecessary collection/disclosure of user data. Documentation-only PRs
          pass unless they expose sensitive information or recommend unsafe steps.
      - name: User data safety
        mode: error
        instructions: >-
          Pass only when changes cannot silently lose or corrupt user collections,
          configuration, saves, backups, inventory, or Pokémon state. Any schema
          change must preserve old data or include a documented, recoverable
          migration. PRs that cannot affect persisted data pass.
      - name: Anki and PyQt compatibility
        mode: error
        instructions: >-
          Pass only when changed runtime code remains compatible with the supported
          Anki/PyQt6 environment and does not block add-on import, startup, review
          hooks, profile switching, or shutdown. Non-runtime changes pass.
      - name: Tests and validation
        mode: warning
        instructions: >-
          Pass when behaviour changes include proportionate automated tests or a
          credible manual validation record. Pure documentation, metadata, or
          generated-data changes may pass with an explicit validation explanation.
      - name: Release consistency
        mode: error
        instructions: >-
          For release or versioning changes, pass only when version metadata, notes,
          tags, build inputs, artifact paths, and release/prerelease intent agree.
          PRs unrelated to releases pass.

  post_merge_actions:
    - name: Synchronise user documentation
      enabled: true
      prompt: |
        Apply only when the merged PR changes user-visible behaviour, a setting or
        default, installation/update steps, or supported Anki/PyQt compatibility.
        Update only the relevant existing documentation in README.md, CONFIG.md, or
        src/Ankimon/config.md so it exactly matches the merged implementation. Open a
        focused follow-up PR. Do not invent behaviour, rewrite unrelated prose, or
        act on internal-only refactors, tests, generated data, or CI-only changes.
    - name: Recheck release metadata
      enabled: true
      prompt: |
        Apply only to PRs labelled release or major, or PRs changing version metadata,
        release notes, packaging, tags, artifact paths, or release workflows. Compare
        addon.json, meta/manifest files, release notes, and workflow inputs. If a
        deterministic inconsistency remains, open a minimal follow-up PR correcting
        only that inconsistency; otherwise return a concise text report confirming the
        checked values. Never choose or increment a version without repository evidence.
    - name: Report residual risks and follow-ups
      enabled: true
      prompt: |
        Apply only when the merged PR, review, or checks explicitly leave unresolved
        non-blocking work, TODOs, missing validation, compatibility uncertainty, or a
        user-data migration risk. Produce a text report in the action results with
        actionable follow-ups, affected paths, evidence, impact, and suggested priority.
        Do not modify files or create tickets, and do not manufacture speculative work.
    - name: Audit upstream divergence
      enabled: true
      prompt: |
        Apply only when the merged change touches behaviour also present in the linked
        Unlucky-Life/ankimon upstream repository or claims to port/cherry-pick upstream
        work. Produce a text report identifying the relevant upstream implementation,
        intentional differences, likely accidental omissions, and future sync risk.
        Do not modify files solely to make the fork match upstream.
    - name: Check translation coverage
      enabled: true
      prompt: |
        Apply only when user-visible strings or files under src/Ankimon/lang change.
        Compare locale keys and placeholders, then produce a text report listing
        missing, stale, malformed, or inconsistent translations by locale and key.
        Do not auto-translate text or modify licence/attribution material.

  tools:
    "github-checks":
      enabled: true
      timeout_ms: 900000
    "ast-grep":
      essential_rules: true
    ruff:
      enabled: true
    semgrep:
      enabled: true
    gitleaks:
      enabled: true
    presidio:
      enabled: true
    osvScanner:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    htmlhint:
      enabled: true
    shellcheck:
      enabled: true
    dotenvLint:
      enabled: true
    languagetool:
      enabled: true
      level: picky

  # Ignore non-reviewable or generated bulk while retaining source, metadata,
  # translations, small configuration data, and workflow files for deep review.
  path_filters:
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!**/.pytest_cache/**"
    - "!**/.ruff_cache/**"
    - "!build/**"
    - "!dist/**"
    - "!missing_back_sprites/**"
    - "!src/ankimon_backups/**"
    - "!src/Ankimon/addon_sprites/**"
    - "!src/Ankimon/addon_files/lib/**"
    - "!src/Ankimon/user_files/backups/**"
    - "!src/Ankimon/user_files/data_files/**"
    - "!src/Ankimon/user_files/sprites/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.zip"
    - "!**/*.mp3"
    - "!**/*.wav"
    - "!**/*.ttf"
    - "!**/*.otf"

  path_instructions:
    - path: "**/*.py"
      instructions: |
        Treat this as an Anki add-on running inside a long-lived desktop process.
        Review for Python correctness, clear state ownership, import-time side
        effects, swallowed exceptions, resource leaks, unsafe file/network access,
        cross-platform paths, and code that can freeze or crash Anki. Prefer small,
        testable functions and preserve public behaviour unless change is explicit.
        Flag fabricated APIs or assumptions not supported by this repository.
    - path: "src/Ankimon/{__init__.py,hooks.py,menu_buttons.py,resources.py}"
      instructions: |
        Scrutinise add-on startup/shutdown, hook registration, duplicate handlers,
        profile lifecycle, reload behaviour, dependency availability, and failures
        that could prevent Anki from starting. Cleanup must mirror registration.
    - path: "src/Ankimon/{gui_classes,pyobj,classes}/**/*.py"
      instructions: |
        Review Qt code for parent/object ownership, signal duplication, thread
        affinity, modal-dialog behaviour, deleted widgets, timers, event-loop
        blocking, safe webview content, accessibility, and correct PyQt6 APIs.
        User-facing errors must be actionable without exposing private data.
    - path: "src/Ankimon/{business.py,functions/**/*.py,utils/**/*.py,poke_engine/**/*.py}"
      instructions: |
        Verify battle and collection invariants, probability boundaries, stat and
        experience arithmetic, item consumption, evolution/catch conditions, and
        deterministic behaviour. When changed logic consumes external or bundled
        data, validate it at the ingestion boundary. Add regression tests for fixed
        edge cases. Do not confuse Pokémon move priority data with repository issue
        priority labels.
    - path: "src/Ankimon/{config*.py,config.json,manifest.json,meta.json,pyobj/settings.py}"
      instructions: |
        Check setting names, types, defaults, migrations, and UI exposure together.
        Preserve unknown/legacy user settings, reject invalid values safely, and
        keep add-on/version metadata consistent with packaging and documentation.
    - path: "{ResetFiles,src/Ankimon/user_files,src/Ankimon/addon_files,src/Ankimon/lang}/**/*.json"
      instructions: |
        Validate JSON structure and UTF-8 content. Check identifiers and references,
        duplicate/missing keys, translations, reset/default parity, and backwards
        compatibility. Never replace user-owned progress with bundled defaults as a
        side effect of an ordinary update.
    - path: "**/*.{html,js,css}"
      instructions: |
        Review content used in Anki webviews for injection/XSS, unsafe interpolation,
        remote-resource assumptions, broken escaping, event/listener leaks, asset
        path portability, accessibility, and layout regressions at common sizes.
    - path: ".github/workflows/**/*.{yml,yaml}"
      instructions: |
        Enforce least-privilege permissions, immutable action pinning where feasible,
        safe handling of event data and shell interpolation, current action APIs,
        deterministic artifacts, valid release/tag logic, and no untrusted code with
        write-capable tokens. Identify workflows that are syntactically incomplete.
    - path: ".github/ISSUE_TEMPLATE/**"
      instructions: |
        Ensure templates gather reproducible steps, supported Anki/Ankimon versions,
        OS, logs with secrets removed, expected behaviour, and minimal diagnostic
        data. Never encourage uploading private collections or unnecessary user data.
    - path: "**/*.{md,txt}"
      instructions: |
        Check technical accuracy, current paths/versions, safe commands, link health,
        accessibility, and consistency with actual code and packaging. Preserve
        licence and attribution text unless the change is demonstrably correct.

chat:
  art: false
  allow_non_org_members: false
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "**/REVIEW.md"
  learnings:
    scope: local
    approval_delay: 3
  issues:
    scope: local
  pull_requests:
    scope: local
  automatic_repository_linking: true
  linked_repositories:
    - repository: Unlucky-Life/ankimon
      instructions: >-
        Upstream Ankimon repository. Use it to recognise upstream fixes, behavioural
        conventions, compatibility decisions, and divergence introduced by this fork.

code_generation:
  docstrings:
    language: en-AU
    path_instructions:
      - path: "**/*.py"
        instructions: |
          Use concise PEP 257 docstrings that explain contract, side effects, state
          mutation, units/ranges, notable exceptions, and Anki/Qt lifecycle demands.
          Do not restate obvious code or invent guarantees absent from implementation.
  unit_tests:
    path_instructions:
      - path: "**/*.py"
        instructions: |
          Prefer pytest regression tests around pure behaviour. Isolate randomness,
          time, network, filesystem, Anki, and PyQt dependencies with fixtures or
          focused fakes. Test boundaries, corrupt/legacy data, rollback behaviour,
          and avoid requiring a user's live Anki profile or display server.

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels:
        - bug
        - enhancement
        - refactoring
        - documentation
        - 00 priority
        - 01 priority
        - 02 priority
        - 03 priority
        - 04 priority
        - "!duplicate"
        - "!invalid"
        - "!wontfix"
  labeling:
    auto_apply_labels: true
    labeling_instructions:
      - label: bug
        instructions: >-
          Apply when the issue reports reproducible incorrect behaviour, a crash,
          regression, data corruption, compatibility problem, or documented feature
          behaving contrary to expectations.
      - label: enhancement
        instructions: >-
          Apply when the issue requests a new capability or a material improvement
          to behaviour, performance, accessibility, or user experience.
      - label: documentation
        instructions: >-
          Apply when the requested outcome primarily changes documentation, setup
          guidance, help text, examples, translations, or explanatory content.
      - label: refactoring
        instructions: >-
          Apply when the issue proposes internal restructuring, cleanup, or technical
          debt work without an intended user-visible behaviour change.
      - label: question
        instructions: >-
          Apply when the issue primarily asks for support, clarification, expected
          behaviour, or usage guidance and does not yet establish a defect.
      - label: duplicate
        instructions: >-
          Apply only when repository context identifies an existing issue describing
          substantially the same problem or request. Include the related issue in the
          enrichment; similarity in a few keywords is insufficient.
      - label: good first issue
        instructions: >-
          Apply when the work is well-scoped, low-risk, locally understandable, and
          can be completed without deep knowledge of Anki hooks, persistence, release
          infrastructure, or coupled battle systems.
      - label: help wanted
        instructions: >-
          Apply when the issue explicitly seeks community help or needs specialised
          testing/domain knowledge that maintainers are unlikely to supply alone.
      - label: 00 priority
        instructions: >-
          Apply only this priority for an emergency: actively exploitable security,
          likely irreversible user-data loss/corruption, a broken release, or a
          widespread failure making Ankimon unusable. Never infer 00 from urgency
          wording alone, and do not apply another priority label with it.
      - label: 01 priority
        instructions: >-
          Apply only this priority for a release blocker, common core-flow crash,
          serious regression, supported Anki/PyQt incompatibility, or high-impact
          security/privacy weakness that is not a 00 emergency. Do not apply another
          priority label with it.
      - label: 02 priority
        instructions: >-
          Apply only this priority to a confirmed non-critical bug, meaningful feature,
          notable performance/accessibility problem, or moderate maintenance risk that
          should be scheduled soon. Do not apply another priority label with it.
      - label: 03 priority
        instructions: >-
          Apply only this priority as the normal default for actionable routine work
          with ordinary impact, including contained bugs, enhancements, refactors,
          tests, and documentation. Do not apply another priority label with it.
      - label: 04 priority
        instructions: >-
          Apply only this priority to non-urgent polish, optional cleanup, cosmetic
          tweaks, or rare low-impact edge cases that can safely wait. Do not apply
          another priority label with it.
