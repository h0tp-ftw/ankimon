name: Prepare and Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g., 2.04 or 2.04-E)"
        required: true
      highlights:
        description: "Highlights/What's new summary (optional)"
        required: false
        type: string

# This workflow runs the whole release end to end — prepare -> integrity test ->
# commit + tag -> build, then a manual approval gate, then publish — without any
# long-lived stored credential. It deliberately does NOT hand off to main.yml via
# a tag push: GitHub won't trigger a second workflow from a tag pushed with
# GITHUB_TOKEN, and a PAT just to trigger that hand-off is a fragile, expiring
# dependency to have to store and rotate. Folding the build+publish in here
# removes it entirely.
#
# On tokens: GITHUB_TOKEN is scoped to a single job. Actions mints a fresh one
# per job and it dies when that job ends (6h ceiling on hosted runners), so it is
# not one token spanning the run. That is precisely what makes the approval gate
# safe to wait on for days: `publish` is issued its own new token when it finally
# starts, rather than needing one to survive the wait. The tag push and the
# release creation each use their job's GITHUB_TOKEN; the push to `main` needs
# more than that, and uses the App installation token — see the NOTE below.
#
# It is split across two jobs on purpose. AnkiWeb must be updated BEFORE the
# GitHub release exists, because Anki decides an add-on is out of date by
# comparing timestamps rather than version numbers — whichever channel publishes
# last looks newer, so a GitHub-first release leaves in-app updater users being
# offered the AnkiWeb build. AnkiWeb has no upload API (scripting the private one
# is against its Terms), so the upload is a human step and the `ankiweb`
# environment gate is what forces it to happen in the right order.
#
#   dispatch -> build (bump, tag, package) -> [you upload to AnkiWeb, approve] -> publish
#
# The step-by-step is on the `publish` job below.
#
# NOTE: pushing the version-bump commit to `main` uses a GitHub App installation
# token (minted below via create-github-app-token) — `main` has a ruleset that
# restricts direct updates + requires PR review, and the built-in GITHUB_TOKEN
# cannot be a ruleset bypass actor. The App (ankimon-release-bot) is on the
# "Main protection" ruleset bypass list. Tag pushes and release creation are
# unaffected (the ruleset targets the main branch only), so they stay on
# GITHUB_TOKEN.
jobs:
  # Everything up to a finished .ankiaddon. The version bump, the tag and the
  # push to main all happen here, because `aab build` dates the manifest from
  # the tag and so needs it to exist first. An abandoned run therefore leaves
  # main claiming a version that was never released — recoverable by approving
  # the held run (it waits 30 days), or by reverting the bump and deleting the tag.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      module_name: ${{ steps.vars.outputs.module_name }}
    # Bind the workflow_dispatch inputs to env vars once, then reference them as
    # "$VERSION" / "$HIGHLIGHTS" in every run: block. Expanding
    # ${{ github.event.inputs.* }} straight into a shell script is a
    # template-injection vector (a value containing quotes or $(...) would
    # execute); a shell reading an env var is safe.
    env:
      VERSION: ${{ github.event.inputs.version }}
      HIGHLIGHTS: ${{ github.event.inputs.highlights }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # The build injects the poke_engine submodule into the .ankiaddon, and
          # `git archive` (used by aab) skips submodule contents — so we need the
          # submodule checked out on disk to inject it manually later.
          submodules: recursive
          # Don't leave the token in .git/config while later steps run third-party
          # code (pip / npx / aab). The pushes below authenticate explicitly with a
          # short-lived token-in-URL instead, so no credential is persisted.
          persist-credentials: false

      # Mint a short-lived (~1h) GitHub App installation token. The App is a bypass
      # actor on the "Main protection" ruleset, so the push to `main` below is
      # allowed; the built-in GITHUB_TOKEN cannot be a ruleset bypass actor.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install release-prep dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest pytest-qt PyQt6 markdown

      - name: Prepare Release Files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/prepare_release.py --version "$VERSION" --highlights "$HIGHLIGHTS"
          python scripts/generate_discord_changelog.py --version "$VERSION"

      - name: Generate Contributors Table
        run: |
          npx -y all-contributors-cli generate

      # Run the integrity gate while PyQt6 is the ONLY Qt binding installed. The
      # build step below adds PyQt5 (aab needs it); keeping the test ahead of that
      # avoids two Qt bindings loading into one interpreter. PYTEST_QT_API pins the
      # binding pytest-qt selects.
      # PyQt6's QtGui (imported by pytest-qt) links against system Qt libraries
      # (libEGL, xcb, …) that aren't on the runner by default. Install them and run
      # under xvfb + the offscreen platform, mirroring integrity_tests.yml — the
      # workflow where this same test passes.
      - name: Install system deps for headless Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            x11-utils libegl1 libpulse0 libnss3 libasound2t64

      - name: Run Integrity Tests
        env:
          PYTEST_QT_API: pyqt6
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a pytest tests/test_addon_integrity.py

      - name: Configure git identity
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit and Push Changes
        env:
          # GitHub App installation token — the App is on the ruleset bypass list,
          # so this direct push to the protected main branch is allowed.
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add src/Ankimon/manifest.json .all-contributorsrc README.md assets/changelogs/
          if git diff --cached --quiet; then
            echo "No release changes to commit (already up to date); skipping commit."
          else
            git commit -m "chore: bump version and update changelog for $VERSION"
            # Explicit token-in-URL push (persist-credentials is off); GitHub masks
            # the token in logs, and it is never written to git config.
            git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Create and Push Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$REMOTE" "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists on origin; skipping tag creation."
          else
            git tag "${VERSION}" -m "Release ${VERSION}"
            git push "$REMOTE" "refs/tags/${VERSION}"
            echo "Pushed tag ${VERSION}."
          fi

      # ---------------------------------------------------------------------------
      # Build & publish (folded in from the old main.yml). Installed here, AFTER the
      # integrity test, so PyQt5 (for aab) and PyQt6 (for the test) never share an
      # interpreter.
      # ---------------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          python -m pip install git+https://github.com/glutanimate/anki-addon-builder.git@4039b5bb743773a18cb2911e6dd38fa1e3f65982
          python -m pip install pyqt5

      - name: Create .ankiaddon package
        run: aab build -d ankiweb

      - name: Inject poke_engine submodule into package
        run: |
          # aab uses `git archive` internally, which silently skips git submodule
          # directories (they appear as gitlinks, not files, in the parent tree).
          # We must manually inject the checked-out submodule into the zip.
          python3 - <<'EOF'
          import os, zipfile

          addon_file = next(f for f in os.listdir("build") if f.endswith(".ankiaddon"))
          addon_path = os.path.join("build", addon_file)
          submodule_src = "src/Ankimon/poke_engine"

          with zipfile.ZipFile(addon_path, "a", zipfile.ZIP_DEFLATED) as zf:
              existing = set(zf.namelist())
              added = 0
              for root, dirs, files in os.walk(submodule_src):
                  dirs[:] = [d for d in dirs if d != "__pycache__"]
                  for fname in files:
                      if fname.endswith((".pyc", ".pyo")):
                          continue
                      abs_path = os.path.join(root, fname)
                      arc_path = os.path.relpath(abs_path, "src/Ankimon").replace(os.sep, "/")
                      if arc_path not in existing:
                          zf.write(abs_path, arc_path)
                          added += 1
              if added == 0:
                  raise SystemExit(
                      "ERROR: injected 0 poke_engine files into the .ankiaddon — the "
                      "poke_engine submodule was not checked out. Aborting to avoid "
                      "shipping a broken add-on."
                  )
              print(f"Injected {added} poke_engine files into {addon_file}")
          EOF

      - name: Copy to stable filename
        run: |
          ADDON_FILE=$(ls build/*.ankiaddon)
          cp "$ADDON_FILE" build/Ankimon.ankiaddon
          echo "Copied $ADDON_FILE to build/Ankimon.ankiaddon"

      - name: Declare variables
        id: vars
        shell: bash
        run: |
          echo "module_name=$(ls src)" >> $GITHUB_OUTPUT
          # Tags in this repo are unprefixed; strip a leading 'v' defensively.
          echo "release_tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_no_prefix=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: previoustag
        run: |
          PREV_TAG=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | \
                     grep -E '^[0-9]+(\.[0-9]+)*(-[A-Z])?$' | \
                     grep -v "^${VERSION}$" | \
                     head -1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="0.0.0"
          fi
          echo "tag=${PREV_TAG}" >> $GITHUB_OUTPUT
          echo "Previous tag: ${PREV_TAG}"

      - name: Patch Changelog for GitHub Release
        env:
          VERSION_NO_V: ${{ steps.vars.outputs.version_no_prefix }}
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
          PREV_TAG: ${{ steps.previoustag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os, re

          version_no_v = os.environ["VERSION_NO_V"]
          release_tag = os.environ["RELEASE_TAG"]
          prev_tag = os.environ["PREV_TAG"]
          repo = os.environ["REPO"]

          path = f"assets/changelogs/{version_no_v}.md"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              # [@username](url) (Nickname) -> @username
              content = re.sub(r'\[@([\w-]+)\]\([^)]+\)\s*\([^)]*\)', r'@\1', content)
              # [@username](url) -> @username
              content = re.sub(r'\[@([\w-]+)\]\([^)]+\)', r'@\1', content)
              # [#number](url) -> #number
              content = re.sub(r'\[(#\d+)\]\([^)]+\)', r'\1', content)
          else:
              content = "No changelog available for this release."

          content += (
              f"\n\n---\n\n**Full Changelog**: "
              f"https://github.com/{repo}/compare/{prev_tag}...{release_tag}"
          )
          content += (
              f"\n\n***\n\n**Download**: "
              f"https://github.com/{repo}/releases/download/{release_tag}/Ankimon.ankiaddon"
          )

          with open("patched_changelog.md", "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      # Pinned to a commit, like the third-party actions above. The artifact is
      # the only thing crossing the approval gate — between this upload and the
      # download below sits a human step and an arbitrary wait, so a mutable tag
      # here means the code that carries the release could change underneath a
      # run that is already half-approved.
      #
      # Both paths are relative to the workspace, so the artifact's root is their
      # least common ancestor — the workspace — and the layout the publish job
      # sees is "build/*.ankiaddon" plus "patched_changelog.md" at the top level.
      # The publish job's paths depend on that; the verification step there fails
      # the run if it ever stops holding.
      - name: Hand the package to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ankiaddon
          path: |
            build/*.ankiaddon
            patched_changelog.md
          if-no-files-found: error
          retention-days: 30

  # AnkiWeb has no public upload API, and scripting the private one is against
  # its Terms — so the upload stays a human step. It has to happen BEFORE the
  # GitHub release exists, because Anki compares timestamps rather than version
  # numbers: whichever channel is published last looks newer. Publishing to
  # GitHub first leaves every in-app updater user with a meta.json "mod" older
  # than the AnkiWeb listing, which is exactly the state that offers them the
  # AnkiWeb build as an "update".
  #
  # The environment holds this job until a required reviewer approves it.
  # Configure it once: Settings → Environments → New environment → "ankiweb",
  # then add yourself under "Required reviewers".
  #
  #   1. Download the "ankiaddon" artifact from this run.
  #   2. Upload Ankimon.ankiaddon at https://ankiweb.net/shared/addons/
  #   3. Approve this job. The GitHub release then goes out, dated after it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: ankiweb
      url: https://ankiweb.net/shared/addons/
    steps:
      - name: Download the package built above
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ankiaddon

      # By the time this job runs, AnkiWeb has already been updated — that is the
      # whole point of the gate above. So this is the last moment a missing file
      # can still be caught for free: publishing a release with no .ankiaddon
      # attached, or with an empty body, would leave the two channels
      # disagreeing with no way to un-publish the AnkiWeb upload. Assert the
      # layout the build job produced rather than trusting it, so a future change
      # to the upload paths fails loudly here instead of shipping a broken release.
      - name: Verify the artifact is complete
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ ! -s patched_changelog.md ]; then
            echo "::error::patched_changelog.md is missing or empty — the release body would be blank."
            exit 1
          fi
          packages=(build/*.ankiaddon)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No build/*.ankiaddon in the artifact — the release would ship without the add-on."
            ls -R . || true
            exit 1
          fi
          # The changelog's download link is hard-coded to this exact filename.
          if [ ! -s build/Ankimon.ankiaddon ]; then
            echo "::error::build/Ankimon.ankiaddon is missing or empty — the changelog's download link would 404."
            exit 1
          fi
          echo "Publishing ${#packages[@]} package(s): ${packages[*]}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "${{ needs.build.outputs.module_name }} v${{ needs.build.outputs.release_tag }}"
          body_path: patched_changelog.md
          files: build/*.ankiaddon
          # Belt and braces with the verification step above: this action's
          # default is to publish happily when `files` matches nothing, which at
          # this point in the run would mean a release with no add-on attached
          # and AnkiWeb already updated. The two guards are independent — this
          # one keeps holding if the glob above ever drifts from the one the
          # verification step checks.
          fail_on_unmatched_files: true
          draft: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
