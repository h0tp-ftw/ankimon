
name: Auto Assign Reviewer

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  assign_reviewer:
    runs-on: ubuntu-24.04
    steps:
      - name: Assign a specific reviewer
        uses: hkusu/review-assign-action@v1
        with:
          reviewers: thepeacemonk   # for peace to be main reviewer