name: Integrity Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  run_integrity_tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        enable-cache: true
        cache-dependency-glob: "requirements.txt"
    - name: Cache apt packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/integrity_tests.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-
    - name: Install system dependencies for headless Qt
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libegl1 libpulse0 libnss3 libasound2t64
    - name: Install Python dependencies
      run: |
        uv pip install --system -r requirements.txt
    - name: Set PYTHONPATH
      run: |
        echo "PYTHONPATH=$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE" >> $GITHUB_ENV
    - name: Run tests with xvfb
      run: |
        xvfb-run -a env QT_QPA_PLATFORM=offscreen pytest tests/

  save_recovery_windows:
    name: Save recovery — native Windows locks
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        enable-cache: true
    - name: Install test dependencies
      run: uv pip install --system pytest requests
    - name: Exercise damaged-save recovery and file publication
      run: >
        python -m pytest -q tests/test_save_import.py tests/test_backup_manager.py
        -k "damaged_save or file_lock or lock_that or windows_handle or
        not_a_lock or publishes_through_locks"
